# Hosted Windows check (INST-REQ-061). Kept here, not in .github/workflows: copy it there only once the repository is public (INST-REQ-063).
name: ci-windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: installer checks on hosted Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Run the installer tests (Python standard library only)
        run: python -m unittest discover -s tests -t . -p "test_installer_*.py" -v
